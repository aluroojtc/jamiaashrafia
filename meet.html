<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Join Meeting - Jamia Ashrafia Lahore</title>
    <!-- Public meeting link (/meet/<code>): no portal sign-in. The server checks the code and signs a guest token. -->
    <link rel="icon" type="image/png" href="/assets/images/favicon.png?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css?v=4.1">
    <link rel="stylesheet" href="/css/components.css?v=6.2">
    <style>
        html, body { min-height: 100%; margin: 0; background: #0b1114; }
        .meet-shell { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
        .meet-card { width: 100%; max-width: 400px; padding: 26px 24px; background: #ffffff; color: #1e293b; border-radius: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); box-sizing: border-box; }
        .meet-head { text-align: center; margin-bottom: 18px; }
        .meet-head img { width: 60px; height: 60px; }
        .meet-head small { display: block; color: #64748b; font-size: 0.8rem; margin-top: 6px; }
        .meet-head h2 { margin: 10px 0 4px; font-size: 1.2rem; color: #0f172a; overflow-wrap: anywhere; }
        .meet-head p { margin: 0; font-size: 0.85rem; color: #64748b; line-height: 1.5; }
        .meet-card label { display: block; font-weight: 600; font-size: 0.85rem; margin: 12px 0 6px; color: #0f172a; }
        .meet-card .form-control { width: 100%; box-sizing: border-box; }
        .meet-error { display: none; margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #fef2f2; color: #b91c1c; font-size: 0.85rem; }
        .meet-card .btn { width: 100%; justify-content: center; margin-top: 18px; padding: 11px; }
        .meet-note { margin-top: 14px; font-size: 0.78rem; color: #64748b; text-align: center; line-height: 1.5; }
        .meet-state { text-align: center; color: #475569; }
        .meet-state i { font-size: 2rem; color: #94a3b8; }
    </style>
</head>
<body>
    <main class="meet-shell">
        <div class="meet-card">
            <div class="meet-head">
                <img src="/assets/images/crest.png" alt="">
                <small>Jamia Ashrafia Lahore</small>
                <h2 id="meet-title">Public Meeting</h2>
                <p id="meet-sub"></p>
            </div>
            <div id="meet-body">
                <div class="meet-state"><i class="fas fa-spinner fa-spin"></i><p>Checking the meeting link...</p></div>
            </div>
        </div>
    </main>

    <script>
    (function () {
        'use strict';
        var NAME_KEY = 'jamia-meet-name';
        var code = (location.pathname.match(/^\/meet\/([A-Za-z0-9_-]{20,64})\/?$/) || [])[1] || '';
        var body = document.getElementById('meet-body');

        function esc(v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function post(path, data) {
            return fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'omit',
                body: JSON.stringify(data)
            }).then(function (res) {
                return res.json().catch(function () { return {}; }).then(function (json) {
                    if (!res.ok || !json.success) throw new Error(json.error || 'The meeting could not be opened. Please try again.');
                    return json;
                });
            });
        }

        function showState(icon, text) {
            body.innerHTML = '<div class="meet-state"><i class="fas ' + icon + '"></i><p>' + esc(text) + '</p></div>';
        }

        function savedName() {
            try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; }
        }

        function meetingUrl(join, name, title) {
            var hash = 'userInfo.displayName=' + encodeURIComponent(JSON.stringify(name))
                + '&config.subject=' + encodeURIComponent(JSON.stringify(title || ''))
                + '&config.prejoinConfig.enabled=false';
            return 'https://' + join.domain + '/' + join.roomPath + (join.token ? '?jwt=' + encodeURIComponent(join.token) : '') + '#' + hash;
        }

        function showForm(meeting) {
            document.getElementById('meet-title').textContent = meeting.title;
            document.getElementById('meet-sub').textContent = 'Hosted by ' + meeting.hostName;
            body.innerHTML =
                '<form id="meet-form" novalidate>'
                + '<label for="meet-name">Your name</label>'
                + '<input type="text" id="meet-name" class="form-control" maxlength="60" autocomplete="name" required value="' + esc(savedName()) + '" placeholder="e.g. Muhammad Ahmad">'
                + '<div class="meet-error" id="meet-error"></div>'
                + '<button type="submit" class="btn btn-primary" id="meet-join"><i class="fas fa-video"></i> Join Meeting</button>'
                + '</form>'
                + '<div class="meet-note">You join as a guest. No account or password is needed.</div>';
            var input = document.getElementById('meet-name');
            input.focus();
            document.getElementById('meet-form').addEventListener('submit', function (e) {
                e.preventDefault();
                var name = input.value.replace(/\s+/g, ' ').trim();
                var err = document.getElementById('meet-error');
                var btn = document.getElementById('meet-join');
                err.style.display = 'none';
                if (name.length < 2) {
                    err.textContent = 'Enter your name.';
                    err.style.display = 'block';
                    return;
                }
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Joining...';
                post('/api/public-meetings/join', { code: code, name: name }).then(function (data) {
                    try { localStorage.setItem(NAME_KEY, name); } catch (e2) { /* private window */ }
                    location.assign(meetingUrl(data.join, data.displayName, data.title));
                }).catch(function (e2) {
                    err.textContent = e2.message;
                    err.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-video"></i> Join Meeting';
                });
            });
        }

        if (!code) {
            showState('fa-link-slash', 'This meeting link is not valid. Check that you copied the whole link.');
            return;
        }
        post('/api/public-meetings/lookup', { code: code }).then(function (data) {
            var m = data.meeting;
            if (!m.active) {
                document.getElementById('meet-title').textContent = m.title;
                showState('fa-door-closed', 'This meeting has ended.');
                return;
            }
            showForm(m);
        }).catch(function (e) {
            showState('fa-link-slash', e.message);
        });
    })();
    </script>
</body>
</html>
